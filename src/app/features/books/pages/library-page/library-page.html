<h1>Book Library</h1>

@if (editingBook(); as book) {
<app-book-form mode="edit" [book]="book" (save)="updateBook($event)" (cancel)="cancelEditing()" />
} @else {
<app-book-form mode="add" (save)="addBook($event)" />
}


<app-book-list [books]="store.books()" (edit)="editBook($event)" (remove)="removeBook($event)"></app-book-list>
