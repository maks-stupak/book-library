<label for="book-search">Search by title</label>
<input id="book-search" type="search" placeholder="Search books..." (input)="updateSearch($event)" />

<button type="button" (click)="sort.emit()">Sort by author and title</button>

<label for="book-import">Import XML</label>
<input id="book-import" type="file" accept=".xml,application/xml" (change)="selectFile($event)" />
